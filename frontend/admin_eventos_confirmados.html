<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - Eventos Confirmados</title>
    <link rel="stylesheet" href="/css/tailwind.min.css">
    <link rel="stylesheet" href="/css/fontawesome.min.css">
    <link rel="stylesheet" href="/styles/admin.css">
    <style>
        .wrap { max-width: 1600px; margin: 0 auto; padding: 20px 16px; }
        #loader { text-align: center; padding: 24px; color: #9f7aea; }
        table { min-width: 700px; }
        td.description { white-space: normal; max-width: 260px; word-break: break-word; }
    </style>
</head>

<body>
    <script src="/navbar.js"></script>
    <main class="wrap">
        <div class="page-header">
            <a href="admin.html" class="btn-back">
                <svg style="width:16px;height:16px" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg> Volver al Panel
            </a>
            <h1>Eventos Confirmados</h1>
            <div class="spacer"></div>
        </div>

        <div class="filters-panel">
            <div class="filters-row">
                <div class="filter-field">
                    <label>Tipo</label>
                    <select id="tipoFilter">
                        <option value="">Todos</option>
                        <option value="ALQUILER">Alquiler</option>
                        <option value="BANDA">Banda</option>
                        <option value="TALLER">Taller</option>
                        <option value="SERVICIO">Servicio</option>
                    </select>
                </div>
                <div class="filter-field">
                    <label>Desde</label>
                    <input type="date" id="desde" />
                </div>
                <div class="filter-field">
                    <label>Hasta</label>
                    <input type="date" id="hasta" />
                </div>
                <div class="filter-field">
                    <label>Hora desde</label>
                    <input type="time" id="hora_desde" />
                </div>
                <div class="filter-field">
                    <label>Hora hasta</label>
                    <input type="time" id="hora_hasta" />
                </div>
                <div class="filter-field">
                    <label>Ordenar por</label>
                    <select id="order_by">
                        <option value="fecha_evento">Fecha</option>
                        <option value="hora_inicio">Hora</option>
                        <option value="nombre_evento">Nombre</option>
                    </select>
                </div>
                <div class="filter-field">
                    <label>Dirección</label>
                    <select id="order_dir">
                        <option value="DESC">Desc</option>
                        <option value="ASC">Asc</option>
                    </select>
                </div>
                <div class="filter-field">
                    <label>Por página</label>
                    <input type="number" id="limit" value="20" style="width:90px" />
                </div>
                <div class="filter-field" style="justify-content:flex-end">
                    <button id="filtrarBtn" class="btn btn-primary">Filtrar</button>
                    <button id="refreshBtn" class="btn btn-secondary" style="margin-left:8px">Actualizar</button>
                </div>
            </div>
        </div>

        <div class="table-container">
            <div id="loader" style="display:none">Cargando...</div>

            <table id="eventsTable">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Hora</th>
                        <th>Tipo</th>
                        <th>Cliente</th>
                        <th>Nombre</th>
                        <th>Flyer</th>
                        <th>Detalles</th>
                        <th>Descripción</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <div id="empty" style="display:none;padding:24px;text-align:center;color:#9f7aea">
                No se encontraron eventos con esos filtros.
            </div>
        </div>

        <div style="display:flex;align-items:center;gap:10px;margin-top:16px">
            <button id="prevPage" class="btn btn-secondary">Anterior</button>
            <span id="pageInfo" style="color:var(--color-text-muted)">Página 1</span>
            <button id="nextPage" class="btn btn-secondary">Siguiente</button>
        </div>
    </main>
    <script>
        function getToken() { return localStorage.getItem('authToken') }
        function getHeaders() { return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` } }

        function showBanner(message, type = 'info', duration = 4000) {
            document.querySelectorAll('.notification-banner').forEach(n => {
                n.classList.remove('show');
                n.classList.add('hide');
                setTimeout(() => n.remove(), 350);
            });
            const banner = document.createElement('div');
            banner.className = `notification-banner ${type}`;
            const icon = type === 'success' ? 'check-circle' : (type === 'error' ? 'exclamation-circle' : 'info-circle');
            banner.innerHTML = `<div style="display:flex;align-items:center;gap:10px;"><i class="fas fa-${icon}"></i><span>${message}</span></div>`;
            document.body.appendChild(banner);
            requestAnimationFrame(() => requestAnimationFrame(() => banner.classList.add('show')));
            setTimeout(() => {
                banner.classList.remove('show');
                banner.classList.add('hide');
                setTimeout(() => banner.remove(), 350);
            }, duration);
        }

        const $loader = document.getElementById('loader');
        const $tbody = document.querySelector('#eventsTable tbody');
        const $empty = document.getElementById('empty');

        async function fetchEventos() {
            $loader.style.display = 'block';
            $tbody.innerHTML = '';
            $empty.style.display = 'none';

            const tipo = document.getElementById('tipoFilter').value;
            const desde = document.getElementById('desde').value;
            const hasta = document.getElementById('hasta').value;
            const limit = document.getElementById('limit').value || 200;

            const params = new URLSearchParams();
            if (tipo) params.set('tipo_evento', tipo);
            if (desde) params.set('fecha_desde', desde);
            if (hasta) params.set('fecha_hasta', hasta);
            const horaDesde = document.getElementById('hora_desde').value;
            const horaHasta = document.getElementById('hora_hasta').value;
            if (horaDesde) params.set('hora_desde', horaDesde);
            if (horaHasta) params.set('hora_hasta', horaHasta);
            const orderBy = document.getElementById('order_by').value;
            const orderDir = document.getElementById('order_dir').value;
            params.set('order_by', orderBy);
            params.set('order_dir', orderDir);
            params.set('limit', limit);
            params.set('offset', currentPage * (parseInt(limit, 10) || 20));

            try {
                updatePageInfo();
                const res = await fetch(`/api/admin/eventos_confirmados?${params.toString()}`, { headers: getHeaders() });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const rows = await res.json();
                if (!rows || rows.length === 0) {
                    $empty.style.display = 'block';
                    return;
                }
                function renderDetails(item) {
                    if (item.tipo_evento && item.tipo_evento.toUpperCase().includes('BANDA')) {
                        return item.genero_musical ? `Género: ${item.genero_musical}` : '';
                    }
                    if (item.cantidad_personas) return `Capacidad: ${item.cantidad_personas}`;
                    if (item.tipo_servicio) return `Servicio: ${item.tipo_servicio}`;
                    if (item.nombre_taller) return `Taller: ${item.nombre_taller}`;
                    return '';
                }

                async function cancelEventoClient(id) {
                    if (!confirm('¿Cancelar este evento?')) return;
                    try {
                        const res = await fetch(`/api/admin/eventos_confirmados/${id}/cancel`, { method: 'PATCH', headers: getHeaders() });
                        if (!res.ok) throw new Error('Error al cancelar');
                        fetchEventos();
                    } catch (err) {
                        console.error('Error cancelando evento', err);
                        showBanner('No se pudo cancelar el evento: ' + err.message, 'error');
                    }
                }

                for (const r of rows) {
                    const tr = document.createElement('tr');
                    const detalles = renderDetails(r);
                    const estadoBadge = r.activo === 0 ? `<span class="estado-cancelado" style="background:#f87171;color:#fff;padding:4px 6px;border-radius:6px;font-weight:700">CANCELADO</span>` : '';
                    tr.innerHTML = `
            <td>${r.fecha_evento || ''}</td>
            <td>${r.hora_inicio || ''}</td>
            <td>${r.tipo_evento || ''}</td>
            <td>${r.nombre_cliente || ''}</td>
            <td>${r.nombre_evento || ''} ${estadoBadge}</td>
            <td>${r.url_flyer ? '<img src="' + r.url_flyer + '" class="flyer-thumb" alt="flyer">' : ''}</td>
            <td>${detalles}</td>
            <td class="description">${r.descripcion_corta || ''}</td>
            <td class="actions-cell">
              <a class="btn" href="/editar_solicitud?id=${r.id_solicitud}">Ver solicitud</a>
              <a class="btn" href="/editar_evento?id=${r.id}" style="background:#4caf50; margin-left:6px">Editar</a>
              <a class="btn" href="/admin_asignar_personal.html?solicitudId=ev_${r.id}&tipoEventoId=${r.tipo_evento}" style="background:#4f46e5;margin-left:6px">Asignar Personal</a>
              <button class="btn btn-cancel" style="background:#f97316;margin-left:6px" onclick="cancelEventoClient(${r.id})">Cancelar</button>
              <button class="btn btn-delete" style="background:#f43f5e;margin-left:6px" onclick="deleteEvento(${r.id})">Eliminar</button>
            </td>
          `;
                    $tbody.appendChild(tr);
                }
                showBanner(`${rows.length} evento${rows.length !== 1 ? 's' : ''} cargado${rows.length !== 1 ? 's' : ''}`, 'success', 2500);
            } catch (err) {
                console.error('Error fetching eventos confirmados', err);
                showBanner('Error al obtener eventos: ' + err.message, 'error');
            } finally {
                $loader.style.display = 'none';
            }
        }

        async function deleteEvento(id) {
            if (!confirm('¿Eliminar este evento definitivamente? Esta acción no se puede deshacer.')) return;
            try {
                const res = await fetch(`/api/admin/eventos_confirmados/${id}`, { method: 'DELETE', headers: getHeaders() });
                if (res.status === 401) { window.location.href = '/login.html'; return; }
                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    throw new Error(data.error || `Error ${res.status}`);
                }
                showBanner('Evento eliminado correctamente', 'success');
                fetchEventos();
            } catch (err) {
                console.error('Error eliminando evento', err);
                showBanner('Error al eliminar evento: ' + err.message, 'error');
            }
        }

        // ============================================================
        // AUTENTICACIÓN Y MENÚ MÓVIL
        // ============================================================
        function toggleMobileMenu() {
            const mobileMenu = document.getElementById('mobile-menu');
            if (mobileMenu) mobileMenu.classList.toggle('hidden');
        }

        function updateAuthMenu() {
            const token = localStorage.getItem('authToken');
            const desktopMenu = document.getElementById('auth-menu-desktop');
            const mobileMenu = document.getElementById('auth-menu-mobile');

            if (token) {
                // Usuario autenticado - mostrar Admin Panel y Logout
                if (desktopMenu) {
                    desktopMenu.innerHTML = `
                        <a href="/admin.html" class="text-sm font-medium hover:text-neon transition duration-150 ease-in-out">🔐 Admin Panel</a>
                        <button onclick="logout()" class="text-sm font-medium hover:text-neon transition duration-150 ease-in-out bg-transparent border-none cursor-pointer">Logout</button>
                    `;
                }
                if (mobileMenu) {
                    mobileMenu.innerHTML = `
                        <a href="/admin.html" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-stone-700 hover:text-neon">🔐 Admin Panel</a>
                        <button onclick="logout()" class="block w-full text-left px-3 py-2 rounded-md text-base font-medium hover:bg-stone-700 hover:text-neon bg-transparent border-none cursor-pointer">Logout</button>
                    `;
                }
            } else {
                // No autenticado - mostrar Login
                if (desktopMenu) {
                    desktopMenu.innerHTML = `<a href="login.html" class="text-sm font-medium hover:text-neon transition duration-150 ease-in-out">Login</a>`;
                }
                if (mobileMenu) {
                    mobileMenu.innerHTML = `<a href="login.html" class="block px-3 py-2 rounded-md text-base font-medium hover:bg-stone-700 hover:text-neon">Login</a>`;
                }
            }
        }

        function logout() {
            localStorage.removeItem('authToken');
            window.location.href = '/index.html';
        }

        // Sincronizar menú de autenticación entre pestañas
        window.addEventListener('storage', updateAuthMenu);

        // Pagination and controls
        let currentPage = 0;

        function updatePageInfo() {
            const pageInfo = document.getElementById('pageInfo');
            if (pageInfo) pageInfo.textContent = `Página ${currentPage + 1}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Inicializar menú de autenticación
            updateAuthMenu();

            // Setup mobile menu button
            const mobileMenuButton = document.getElementById('mobile-menu-button');
            if (mobileMenuButton) {
                mobileMenuButton.addEventListener('click', toggleMobileMenu);
            }

            // Close mobile menu when clicking links
            const mobileMenu = document.getElementById('mobile-menu');
            if (mobileMenu) {
                mobileMenu.querySelectorAll('a').forEach(link => {
                    link.addEventListener('click', () => {
                        mobileMenu.classList.add('hidden');
                    });
                });
            }

            // Setup pagination buttons
            const prevPageBtn = document.getElementById('prevPage');
            const nextPageBtn = document.getElementById('nextPage');

            if (prevPageBtn) {
                prevPageBtn.addEventListener('click', () => {
                    if (currentPage > 0) { currentPage -= 1; fetchEventos(); }
                });
            }

            if (nextPageBtn) {
                nextPageBtn.addEventListener('click', () => { currentPage += 1; fetchEventos(); });
            }

            // Setup filter and refresh buttons
            const filtrarBtn = document.getElementById('filtrarBtn');
            const refreshBtn = document.getElementById('refreshBtn');

            if (filtrarBtn) {
                filtrarBtn.addEventListener('click', () => { currentPage = 0; fetchEventos(); });
            }

            if (refreshBtn) {
                refreshBtn.addEventListener('click', fetchEventos);
            }

            // Auto load
            fetchEventos();
        });
    </script>
</body>

</html>

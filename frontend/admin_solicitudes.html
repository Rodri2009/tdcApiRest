<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel de Administración - Solicitudes</title>
    <link rel="stylesheet" href="/css/tailwind.min.css">
    <link rel="stylesheet" href="/css/fontawesome.min.css">
    <link rel="stylesheet" href="/styles/admin.css">
    <style>
        /* Estilos exclusivos de admin_solicitudes */

        .wrap {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 30px;
            margin-top: 2rem;
        }

        h2 {
            text-align: center;
            margin-bottom: 5px;
            font-size: 2.25rem !important;
            font-weight: bold;
            text-shadow: 0 0 5px var(--color-secondary), 0 0 10px var(--color-secondary);
        }

        /* Estado row colors - mantener consistencia visual */
        .estado-solicitado,
        .estado-contactado,
        .estado-cancelado,
        .estado-confirmado {
            background: inherit;
        }

        /* Filas alternadas con colores oscuros */
        tbody tr:nth-child(odd) {
            background-color: #1a2537;
        }

        tbody tr:nth-child(even) {
            background-color: #131c2a;
        }

        /* Columnas específicas con wrap */
        th:nth-child(3),
        td:nth-child(3) {
            white-space: normal;
            min-width: 130px;
        }

        th:nth-child(4),
        td:nth-child(4) {
            min-width: 110px;
        }

        th:nth-child(8),
        td:nth-child(8) {
            white-space: normal;
            max-width: 250px;
            min-width: 150px;
            word-break: break-word;
        }

        table {
            min-width: 820px;
        }

        select.estado-select {
            padding: 8px 12px;
            border: 2px solid #667eea;
            border-radius: 6px;
            font-size: 13px;
            background-color: #2a2a2a;
            color: var(--color-text);
            cursor: pointer;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
            max-width: 100%;
        }

        select.estado-select:hover {
            border-color: #764ba2;
        }

        select.estado-select:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .actions-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .row-editable {
            cursor: pointer;
        }

        .row-editable:hover {
            background-color: rgba(240, 171, 252, 0.08);
        }

        .flyer-missing {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 100px;
            min-width: 120px;
            padding: 0 10px;
            border: 1px dashed rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.03);
            color: #e2e8f0;
            font-size: 14px;
            border-radius: 8px;
            text-align: center;
            line-height: 1.2;
        }

        .flyer-missing-text {
            display: block;
            margin-top: 6px;
            font-size: 12px;
            color: #9ca3af;
        }

        .btn-upload-flyer {
            margin-top: 8px;
            padding: 5px 10px;
            font-size: 11px;
            background: rgba(102, 126, 234, 0.15);
            border: 1px solid rgba(102, 126, 234, 0.5);
            border-radius: 6px;
            color: #a5b4fc;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease;
            white-space: nowrap;
        }

        .btn-upload-flyer:hover {
            background: rgba(102, 126, 234, 0.3);
            border-color: #667eea;
        }

        td[data-label="Flyer"] {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 8px;
        }

        .flyer-thumb {
            max-width: 100px;
            max-height: 100px;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .flyer-thumb:hover {
            transform: scale(1.05);
        }

        td[data-label="Flyer"] {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 8px;
        }

        .flyer-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            pointer-events: none;
        }

        .flyer-modal.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .flyer-modal-content {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100001;
        }

        .flyer-modal-content img {
            display: block;
            max-width: 85vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .flyer-modal-close {
            position: absolute;
            top: -12px;
            right: -12px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.95);
            color: #111;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.25);
        }

        .actions-buttons {
            display: flex;
            gap: 6px;
        }

        #loader {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-weight: 600;
            font-size: 16px;
        }
    </style>
    <script src="./navbar.js"></script>
</head>

<body>
    <main class="wrap">
        <div class="page-header">
            <a href="admin.html" class="btn-back">
                <svg style="width: 16px; height: 16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg> Volver al Panel
            </a>
            <h1 class="text-4xl font-bold">Administración de Solicitudes</h1>
            <div class="spacer"></div>
        </div>

        <!-- FILTROS -->
        <div class="filters-panel">
            <div class="filters-row">
                <!-- Búsqueda por texto -->
                <div class="filter-field" style="flex: 1; min-width: 200px;">
                    <label>Buscar</label>
                    <input type="text" id="filtro-busqueda" placeholder="Cliente, ID, banda...">
                </div>

                <!-- Filtro por Estado -->
                <div class="filter-field">
                    <label>Estado</label>
                    <select id="filtro-estado">
                        <option value="">Todos</option>
                        <option value="Solicitado">Solicitado</option>
                        <option value="Contactado">Contactado</option>
                        <option value="Confirmado">Confirmado</option>
                        <option value="Cancelado">Cancelado</option>
                    </select>
                </div>

                <!-- Filtro por Tipo -->
                <div class="filter-field">
                    <label>Tipo</label>
                    <select id="filtro-tipo">
                        <option value="">Todos</option>
                        <option value="ALQUILER_SALON">Alquiler del Salón</option>
                        <option value="FECHA_BANDAS">Fecha para Bandas</option>
                        <option value="TALLERES">Talleres</option>
                        <option value="SERVICIOS">Servicios</option>
                    </select>
                </div>

                <!-- Filtro por Fecha Desde -->
                <div class="filter-field">
                    <label>Fecha Desde</label>
                    <input type="date" id="filtro-fecha-desde">
                </div>

                <!-- Filtro por Fecha Hasta -->
                <div class="filter-field">
                    <label>Fecha Hasta</label>
                    <input type="date" id="filtro-fecha-hasta">
                </div>

                <!-- Botón Limpiar -->
                <div class="filter-field" style="justify-content: flex-end;">
                    <button id="btn-limpiar-filtros" class="btn btn-primary">
                        <i class="fas fa-times"></i> Limpiar
                    </button>
                </div>
            </div>

            <!-- Contador de resultados -->
            <div id="contador-resultados" class="filter-results"></div>
        </div>

        <div class="table-container" id="admin-table-container">
            <div id="loader">Cargando solicitudes...</div>
            <table id="solicitudes-table" style="display:none">
                <thead>
                    <tr>
                        <th>Creado</th>
                        <th style="display:none;">Fecha Solicitud</th>
                        <!-- <th>Categoría</th> -->
                        <th>Tipo</th>
                        <th>Cliente</th>
                        <th>Fecha <br> Evento</th>
                        <th style="width:70px;">Hora <br> Inicio</th>
                        <th style="width:90px;">Flyer</th>
                        <th>Descripción</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="solicitudes-tbody"></tbody>
            </table>
        </div>
        <div id="notification-banner"></div>
        <div id="flyer-modal" class="flyer-modal" aria-hidden="true">
            <div class="flyer-modal-content">
                <button type="button" class="flyer-modal-close" aria-label="Cerrar">×</button>
                <img id="flyer-modal-img" src="" alt="Flyer ampliado">
            </div>
        </div>
        <script>
            function handleFlyerError(img) {
                img.onerror = null;
                const fallback = document.createElement('span');
                fallback.className = 'flyer-missing';
                fallback.style.flexDirection = 'column';
                const tr = img.closest('tr');
                const solicitudId = tr ? tr.dataset.solicitudId : '';
                fallback.innerHTML = `📄<span class="flyer-missing-text">Flyer no disponible</span><button type="button" class="btn-upload-flyer" data-solicitud-id="${solicitudId}">＋ Subir imagen</button>`;
                img.replaceWith(fallback);
            }

            document.addEventListener('DOMContentLoaded', () => {
                const tbody = document.getElementById('solicitudes-tbody');
                const table = document.getElementById('solicitudes-table');
                const loader = document.getElementById('loader');
                let notificationTimer;

                const flyerModal = document.getElementById('flyer-modal');
                const flyerModalImg = document.getElementById('flyer-modal-img');
                const flyerModalClose = document.querySelector('.flyer-modal-close');

                function abrirFlyerModal(src, alt) {
                    flyerModalImg.src = src;
                    flyerModalImg.alt = alt || 'Flyer ampliado';
                    flyerModal.classList.add('show');
                    flyerModal.setAttribute('aria-hidden', 'false');
                }

                function cerrarFlyerModal() {
                    flyerModal.classList.remove('show');
                    flyerModal.setAttribute('aria-hidden', 'true');
                    flyerModalImg.src = '';
                }

                flyerModalClose.addEventListener('click', cerrarFlyerModal);
                flyerModal.addEventListener('click', (event) => {
                    if (event.target === flyerModal) {
                        cerrarFlyerModal();
                    }
                });

                document.addEventListener('keydown', (event) => {
                    if (event.key === 'Escape' && flyerModal.classList.contains('show')) {
                        cerrarFlyerModal();
                    }
                });

                // Datos originales para filtrado
                let todasLasSolicitudes = [];

                // Referencias a filtros
                const filtroBusqueda = document.getElementById('filtro-busqueda');
                const filtroEstado = document.getElementById('filtro-estado');
                const filtroTipo = document.getElementById('filtro-tipo');
                const filtroFechaDesde = document.getElementById('filtro-fecha-desde');
                const filtroFechaHasta = document.getElementById('filtro-fecha-hasta');
                const btnLimpiar = document.getElementById('btn-limpiar-filtros');
                const contadorResultados = document.getElementById('contador-resultados');

                // Event listeners para filtros
                filtroBusqueda.addEventListener('input', aplicarFiltros);
                filtroEstado.addEventListener('change', aplicarFiltros);
                filtroTipo.addEventListener('change', aplicarFiltros);
                filtroFechaDesde.addEventListener('change', aplicarFiltros);
                filtroFechaHasta.addEventListener('change', aplicarFiltros);
                btnLimpiar.addEventListener('click', limpiarFiltros);

                function limpiarFiltros() {
                    filtroBusqueda.value = '';
                    filtroEstado.value = '';
                    filtroTipo.value = '';
                    filtroFechaDesde.value = '';
                    filtroFechaHasta.value = '';
                    aplicarFiltros();
                }

                function aplicarFiltros() {
                    const busqueda = filtroBusqueda.value.toLowerCase().trim();
                    const estado = filtroEstado.value;
                    const tipo = filtroTipo.value;
                    const fechaDesde = filtroFechaDesde.value;
                    const fechaHasta = filtroFechaHasta.value;

                    const filtradas = todasLasSolicitudes.filter(s => {
                        // Filtro por búsqueda de texto
                        if (busqueda) {
                            const textoCompleto = [
                                s.id,
                                s.nombreCliente,
                                s.subtipo,
                                s.tipoNombre,
                                s.descripcionCorta,
                                s.tipoEventoId
                            ].filter(Boolean).join(' ').toLowerCase();
                            if (!textoCompleto.includes(busqueda)) return false;
                        }

                        // Filtro por estado
                        if (estado && s.estado !== estado) return false;

                        // Filtro por tipo (categoría)
                        if (tipo) {
                            // Normalizar valores del filtro para que coincidan con los valores devueltos por el backend
                            const mapTipo = {
                                'TALLERES': 'TALLER',
                                'TALLERES_ACTIVIDADES': 'TALLER',
                                'SERVICIOS': 'SERVICIO',
                                'FECHA_BANDAS': 'BANDA'
                            };
                            const tipoNormalizado = mapTipo[tipo] || tipo;
                            // Soportar filtrado por categoría o por tipoName (comparar tanto con el valor original como con la versión normalizada)
                            if (
                                s.tipoEvento !== tipoNormalizado && s.tipoEvento !== tipo &&
                                s.categoria !== tipoNormalizado && s.categoria !== tipo &&
                                s.tipoNombre !== tipoNormalizado && s.tipoNombre !== tipo
                            ) return false;
                        }

                        // Filtro por fecha desde
                        if (fechaDesde && s.fechaEvento && s.fechaEvento < fechaDesde) return false;

                        // Filtro por fecha hasta
                        if (fechaHasta && s.fechaEvento && s.fechaEvento > fechaHasta) return false;

                        return true;
                    });

                    renderizarSolicitudes(filtradas);
                    contadorResultados.textContent = `Mostrando ${filtradas.length} de ${todasLasSolicitudes.length} solicitudes`;
                }

                // Event delegation for button clicks (action-btn and icon-btn)
                tbody.addEventListener('click', (event) => {
                    const flyerImg = event.target.closest('img.flyer-thumb');
                    if (flyerImg) {
                        event.stopPropagation();
                        event.preventDefault();
                        abrirFlyerModal(flyerImg.src, flyerImg.alt);
                        return;
                    }

                    const tr = event.target.closest('tr');
                    if (!tr) return;

                    // convertir clic en cualquier lugar de la fila en modificación si no se hizo sobre un botón
                    const button = event.target.closest('button.action-btn, button.icon-btn, .row-hover-overlay');
                    if (!button) {
                        const solicitudId = tr.dataset.solicitudId;
                        const tipoEventoId = tr.dataset.tipoEventoId;
                        const categoria = tr.dataset.categoria;
                        const origen = tr.dataset.origen;
                        modificarSolicitud(solicitudId, categoria, origen);
                        return;
                    }

                    const solicitudId = tr.dataset.solicitudId;
                    const tipoEventoId = tr.dataset.tipoEventoId;

                    const categoria = tr.dataset.categoria;
                    const origen = tr.dataset.origen;

                    // Handle row-hover-overlay (modification hand)
                    if (button.classList.contains('row-hover-overlay') || button.dataset.action === 'modify') {
                        const modifyId = button.dataset.id || solicitudId;
                        const modifyTipo = button.dataset.tipo || tipoEventoId;
                        modificarSolicitud(modifyId, categoria, origen);
                        return;
                    }

                    // Handle other buttons
                    if (button.classList.contains('btn-delete')) {
                        eliminarSolicitud(solicitudId);
                    } else if (button.classList.contains('btn-edit')) {
                        modificarSolicitud(solicitudId, categoria, origen);
                    } else if (button.classList.contains('btn-edit-event')) {
                        // Eventos de bandas -> editor especializado
                        window.location.href = `/editar_solicitud_fecha_bandas.html?solicitudId=${encodeURIComponent(solicitudId)}`;
                    } else if (button.classList.contains('btn-delete-event')) {
                        eliminarEventoClient(solicitudId);
                    } else if (button.dataset.action === 'assign') {
                        // data-id puede ser 'ev_<id>' o id numérico
                        asignarPersonal(button.dataset.id || solicitudId, button.dataset.tipo || tipoEventoId);
                    } else if (button.dataset.action === 'work-order') {
                        verOrdenDeTrabajo(button.dataset.id || solicitudId);
                    }
                });

                // Event delegation for status changes
                tbody.addEventListener('change', (event) => {
                    const select = event.target.closest('select.estado-select');
                    if (!select) return;

                    const id = select.dataset.id;
                    const nuevoEstado = select.value;

                    // Buscar el estado anterior en los datos cargados para revertir si falla
                    const solicitud = todasLasSolicitudes.find(s => String(s.id) === String(id));
                    const estadoAnterior = solicitud ? solicitud.estado : select.value;

                    // Actualizar visualmente el estado inmediatamente
                    select.dataset.estadoAnterior = estadoAnterior;

                    cambiarEstado(id, nuevoEstado, select, estadoAnterior);
                });

                // Event delegation for visibility toggle
                tbody.addEventListener('change', (event) => {
                    const checkbox = event.target.closest('input.publico-checkbox');
                    if (!checkbox) return;
                    cambiarVisibilidad(checkbox.dataset.id, checkbox.checked);
                });

                function asignarPersonal(id, tipo) {
                    if (!id || !tipo) {
                        showNotification('Faltan datos', 'error');
                        return;
                    }
                    window.location.href = `/admin_asignar_personal.html?solicitudId=${id}&tipoEventoId=${tipo}`;
                }

                function verOrdenDeTrabajo(id) {
                    if (!id) return;
                    window.location.href = `/admin_orden_de_trabajo.html?solicitudId=${id}`;
                }

                function modificarSolicitud(id, categoria, origen) {
                    console.log('modificarSolicitud:', { id, categoria, origen });
                    // Redirigir al editor correcto según categoría/origen
                    // Si es origen 'solicitud', usar editor específico según tipo
                    // Los editores especializados son para datos ya convertidos (inscripciones, turnos, eventos)
                    if (origen === 'evento') {
                        console.log('Redirigiendo a editor de evento banda con id:', id);
                        window.location.href = `/editar_solicitud_fecha_bandas.html?solicitudId=${encodeURIComponent(id)}`;
                    } else if (origen === 'inscripcion') {
                        window.location.href = `/editar_inscripcion_taller.html?id=${encodeURIComponent(id)}`;
                    } else if (origen === 'turno') {
                        window.location.href = `/editar_turno_servicio.html?id=${encodeURIComponent(id)}`;
                    } else if (categoria === 'FECHA_BANDAS' || categoria === 'BANDA') {
                        console.log('Redirigiendo a editor de solicitud fecha bandas con id:', id);
                        window.location.href = `/editar_solicitud_fecha_bandas.html?solicitudId=${encodeURIComponent(id)}`;
                    } else if (categoria === 'ALQUILER_SALON') {
                        window.location.href = `/editar_solicitud_alquiler.html?solicitudId=${encodeURIComponent(id)}`;
                    } else {
                        // Si el id contiene un prefijo conocido, usarlo para decidir el editor (prioritario)
                        const idStr = String(id || '');
                        if (idStr.startsWith('tll_')) {
                            window.location.href = `/editar_solicitud_talleres.html?solicitudId=${encodeURIComponent(id)}`;
                            return;
                        }
                        if (idStr.startsWith('bnd_')) {
                            window.location.href = `/editar_solicitud_fecha_bandas.html?solicitudId=${encodeURIComponent(id)}`;
                            return;
                        }
                        if (idStr.startsWith('srv_')) {
                            window.location.href = `/editar_solicitud_servicios.html?solicitudId=${encodeURIComponent(id)}`;
                            return;
                        }

                        // Normalizar categoría amplia (incluye 'TALLER', 'TALLERES', 'TALLERES_ACTIVIDADES', etc.)
                        const norm = String(categoria || origen || '').toUpperCase();

                        if (norm.includes('TALLER')) {
                            window.location.href = `/editar_solicitud_talleres.html?solicitudId=${encodeURIComponent(id)}`;
                        } else if (norm.includes('BAND')) {
                            window.location.href = `/editar_solicitud_fecha_bandas.html?solicitudId=${encodeURIComponent(id)}`;
                        } else if (norm.includes('SERVIC')) {
                            window.location.href = `/editar_solicitud_servicios.html?solicitudId=${encodeURIComponent(id)}`;
                        } else {
                            console.warn('Categoría no reconocida:', categoria, 'para id:', id);
                            alert('Editor no disponible para este tipo de solicitud.');
                        }
                    }
                }

                // Base URL de API: usa el mismo origen del frontend para respetar el proxy
                // de Nginx y evitar puertos hardcodeados del backend.
                const API_BASE_URL = window.location.origin;

                function adminFetch(endpoint, options = {}) {
                    return fetch(`${API_BASE_URL}${endpoint}`, options);
                }

                async function cargarSolicitudes() {
                    console.log('Iniciando carga de solicitudes...');
                    loader.style.display = 'block';
                    table.style.display = 'none';

                    try {
                        const token = localStorage.getItem('authToken');
                        const headers = {};
                        if (token) {
                            headers['Authorization'] = `Bearer ${token}`;
                        }

                        // El frontend debe apuntar al proxy del mismo origen para no depender
                        // del puerto interno del backend en Docker.
                        const apiBaseUrl = window.location.origin;

                        const res = await fetch(`${apiBaseUrl}/api/admin/solicitudes`, {
                            headers: headers
                        });

                        if (res.status === 401) {
                            window.location.href = '/login.html';
                            return;
                        }

                        if (!res.ok) throw new Error('Error al conectar con el servidor');

                        let data = await res.json();
                        console.log('Solicitudes recibidas:', data);

                        // seguridad adicional: si backend devolvió un solo objeto en lugar de
                        // un arreglo, convertirlo en arreglo para evitar fallos de TypeError.
                        if (!Array.isArray(data) && data !== null && typeof data === 'object') {
                            data = [data];
                        }

                        if (!Array.isArray(data) || data.length === 0) {
                            loader.textContent = 'No se encontraron solicitudes.';
                            return;
                        }

                        // Log tipos de eventos (normalizamos varios campos posibles para evitar undefined)
                        const tipos = data.map(s => s.tipoEvento || s.tipoEventoId || s.categoria || s.tipoNombre || s.tipoServicioId).filter(Boolean);
                        console.log('Tipos de eventos encontrados:', [...new Set(tipos)]);

                        // Guardar datos para filtrado
                        // ordenar localmente por fechaSolicitud desc por si el backend no lo hace
                        data.sort((a, b) => new Date(b.fechaSolicitud) - new Date(a.fechaSolicitud));
                        todasLasSolicitudes = data;

                        // Renderizar todas las solicitudes
                        renderizarSolicitudes(data);
                        contadorResultados.textContent = `Mostrando ${data.length} de ${data.length} solicitudes`;

                        showNotification(`${data.length} solicitud${data.length !== 1 ? 'es' : ''} cargada${data.length !== 1 ? 's' : ''}`, 'success', 2500);
                    } catch (error) {
                        console.error(error);
                        loader.textContent = `Error: ${error.message}`;
                    }
                }

                function renderizarSolicitudes(solicitudes) {
                    console.log('Renderizando', solicitudes.length, 'solicitudes');
                    tbody.innerHTML = '';

                    if (solicitudes.length === 0) {
                        loader.style.display = 'block';
                        loader.textContent = 'No se encontraron solicitudes con los filtros aplicados.';
                        table.style.display = 'none';
                        return;
                    }

                    solicitudes.forEach((solicitud) => {
                        const tr = document.createElement('tr');
                        tr.dataset.solicitudId = solicitud.id;
                        tr.dataset.tipoEventoId = solicitud.tipoEventoId || solicitud.tipoEvento || '';
                        tr.dataset.origen = solicitud.origen || '';
                        // Preferimos 'categoria' devuelto por el backend; si no existe, usamos 'tipoEvento'
                        tr.dataset.categoria = solicitud.categoria || solicitud.tipoEvento || '';
                        // Fecha de solicitud (timestamp) - mostrar fecha+hora local
                        //const fechaSolicitud = solicitud.fechaSolicitud ? (new Date(solicitud.fechaSolicitud)).toLocaleString('es-AR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }) : 'N/A';
                        const fechaSolicitud = solicitud.fechaSolicitud ? (new Date(solicitud.fechaSolicitud)).toLocaleString('es-AR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }).replace(', ', '<br>').replace(/([ap])\.\s+m\./g, '$1m') : 'N/A';
                        // Formato Fecha Evento: Nombre corto del día, DD, MM, AAAA
                        const fechaEvento = solicitud.fechaEvento ? (() => {
                            const d = new Date(String(solicitud.fechaEvento) + 'T00:00:00');
                            const weekday = d.toLocaleDateString('es-AR', { weekday: 'long' });
                            const date = d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
                            return `${weekday}<br>${date}`;
                        })() : 'N/A';
                        const horaInicio = solicitud.horaInicio ? String(solicitud.horaInicio).slice(0, 5) : '-';
                        const descripcionCorta = solicitud.descripcionCorta || '<em>Sin descripción</em>';

                        let botones = '';
                        // Mostrar Eliminar, Asignar y Orden con iconos.
                        // El botón "Modificar" ahora es una manito en hover en la primera columna.
                        // Para eventos `id` viene como 'ev_<id>' y `solicitud.origen==='evento'`.
                        const isEvento = solicitud.origen === 'evento';
                        const isConfirmado = (String(solicitud.estado).toLowerCase() === 'confirmado');
                        if (isConfirmado) tr.classList.add('estado-confirmado');

                        // Verificar permisos de edición
                        const puedeEditarSolicitudes = puedeEditar('solicitudes');
                        const puedeEliminarSolicitudes = tienePermiso('solicitudes.eliminar');
                        const puedeCambiarEstado = tienePermiso('solicitudes.cambiar_estado');
                        const puedeGestionarPersonal = tienePermiso('personal.gestionar');

                        if (puedeEditarSolicitudes) {
                            tr.classList.add('row-editable');
                        }

                        console.log(`%c📋 Solicitud ${solicitud.id}`, 'color: #00aaff; font-weight: bold');
                        console.log('  Editar:', puedeEditarSolicitudes);
                        console.log('  Eliminar:', puedeEliminarSolicitudes);
                        console.log('  Cambiar Estado:', puedeCambiarEstado);
                        console.log('  Gestionar Personal:', puedeGestionarPersonal);

                        // Botones como iconos
                        if (isConfirmado) {
                            // Mostrar botón "Asignar Personal" con icono siempre que esté confirmado (si tiene permiso)
                            if (puedeGestionarPersonal) {
                                botones += `<button class="icon-btn btn-assign" data-action="assign" data-id="${solicitud.id}" data-tipo="${solicitud.tipoEventoId}" title="Asignar Personal">👥</button>`;
                            }
                            // Solo mostrar "Orden de Trabajo" si ya tiene personal asignado
                            if (solicitud.tienePersonalAsignado) {
                                botones += `<button class="icon-btn btn-work-order" data-action="work-order" data-id="${solicitud.id}" title="Ver Orden de Trabajo">📋</button>`;
                            }
                        }



                        // Mapear categoría a nombre legible
                        const tiposLegibles = {
                            'ALQUILER_SALON': 'Alquiler del Salón',
                            'FECHA_BANDAS': 'Fecha para Bandas',
                            'TALLERES': 'Taller',
                            'TALLERES_ACTIVIDADES': 'Taller',
                            'SERVICIO': 'Servicio',
                            'SERVICIOS': 'Servicio',
                            'OTRO': 'Otro'
                        };
                        const tipoLegible = tiposLegibles[solicitud.tipoEvento] || solicitud.tipoEvento;

                        // Para ALQUILER_SALON, mostrar el subtipo específico (INFANTILES, INFORMALES, etc.)
                        // Si no hay subtipo, usar tipoEventoId si es diferente de la categoría
                        let subtipoDisplay = solicitud.subtipo;
                        if (!subtipoDisplay && solicitud.tipoEvento === 'ALQUILER_SALON' && solicitud.tipoEventoId) {
                            // Mapear IDs a nombres legibles
                            const subtiposAlquiler = {
                                'INFANTILES': 'Infantiles',
                                'INFORMALES': 'Informales',
                                'CON_SERVICIO_DE_MESA': 'Con servicio de mesa',
                                'BABY_SHOWERS': 'Baby Showers',
                                'ADOLESCENTES': 'Adolescentes'
                            };
                            subtipoDisplay = subtiposAlquiler[solicitud.tipoEventoId] || solicitud.tipoEventoId;
                        }
                        subtipoDisplay = subtipoDisplay || '<em>Sin especificar</em>';

                        // Banda/Artista and Cantidad/Aforo removed from admin view (use descripcionCorta/tipoNombre)
                        // (Field kept in other forms/controllers if needed)

                        const estadoDisplay = `<div class="estado-badge ${String(solicitud.estado).toLowerCase()}">${solicitud.estado}</div>${!solicitud.es_publico ? '<div class="privado-indicator">🔒 Privado</div>' : ''}`;
                        tr.innerHTML = `<td data-label="Creado" title="ID: ${solicitud.id}">${fechaSolicitud}</td>
                        <td data-label="Fecha Solicitud" style="display:none;">${fechaSolicitud}</td>
                        <td data-label="Tipo">${solicitud.tipoNombre || tipoLegible}</td>
                        <td data-label="Cliente">${(solicitud.nombreCliente || '') + (solicitud.apellidoCliente ? '<br>' + solicitud.apellidoCliente : '') || '<em>No completado</em>'}</td>
                        <td data-label="Fecha Evento">${fechaEvento}</td>
                        <td data-label="Hora Inicio">${horaInicio}</td>
                        <td data-label="Flyer">${(solicitud.url_flyer || solicitud.flyer_url) ? '<img src="' + (solicitud.url_flyer || solicitud.flyer_url) + '" class="flyer-thumb" alt="flyer" onerror="handleFlyerError(this)">' : '<span class="flyer-missing" style="flex-direction:column;">📄<span class="flyer-missing-text">Sin flyer</span><button type="button" class="btn-upload-flyer" data-solicitud-id="' + solicitud.id + '">＋ Subir imagen</button></span>'}</td>
                        <td data-label="Descripción"><div class="description">${descripcionCorta}</div></td>
                        <td data-label="Acciones"><div class="actions-cell">${estadoDisplay}<div class="actions-buttons">${botones}</div></div></td>`;

                        tbody.appendChild(tr);

                        // La fila es clickeable con el propio evento de tabla; no se muestra overlay de mano.
                        // Eliminar el overlay visual mejora la experiencia y evita cursor de mano innecesario.
                        // Si se necesita un indicador de edición, se puede agregar en los botones de acción.

                    });

                    loader.style.display = 'none';
                    table.style.display = 'table';
                }

                async function cambiarEstado(id, nuevoEstado, selectElement, estadoAnterior) {
                    showNotification('Actualizando estado...', 'info', 1500); try {
                        let res;
                        // Si es un evento (id empieza con ev_), usamos endpoints de eventos
                        if (String(id).startsWith('ev_')) {
                            const raw = String(id).replace('ev_', '');
                            const eventId = parseInt(raw, 10);
                            if (isNaN(eventId)) throw new Error('ID de evento inválido');

                            if (nuevoEstado === 'Confirmado') {
                                // marcar activo y estado
                                res = await fetch(`/api/admin/eventos_confirmados/${eventId}`, {
                                    method: 'PUT',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ activo: 1, estado: 'Confirmado' })
                                });
                            } else if (nuevoEstado === 'Cancelado') {
                                // usar endpoint de cancel
                                res = await fetch(`/api/admin/eventos_confirmados/${eventId}/cancel`, { method: 'PATCH' });
                            } else {
                                // Solicitud o Contactado -> actualizar solo estado
                                res = await fetch(`/api/admin/eventos_confirmados/${eventId}`, {
                                    method: 'PUT',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ estado: nuevoEstado })
                                });
                            }
                        } else {
                            // solicitud normal
                            res = await fetch(`/api/admin/solicitudes/${id}/estado`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ estado: nuevoEstado })
                            });
                        }

                        const data = await res.json();
                        if (!res.ok) throw new Error(data.message || 'Error al cambiar estado');

                        showNotification(data.message, 'success');

                        // Recargar la lista completa para actualizar botones y estado visual
                        await cargarSolicitudes();
                    } catch (error) {
                        showNotification(error.message, 'error');

                        // Revertir el cambio visual si la API falla
                        if (selectElement && estadoAnterior !== undefined) {
                            selectElement.value = estadoAnterior;
                        }

                        // Recargar para asegurar que el estado de la UI y los datos coincidan
                        cargarSolicitudes();
                    }
                }

                async function cambiarVisibilidad(id, esPublico) {
                    showNotification('Actualizando visibilidad...', 'info', 1500);
                    try {
                        const res = await fetch(`/api/admin/solicitudes/${id}/visibilidad`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ es_publico: esPublico })
                        });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.message || 'Error al cambiar visibilidad');
                        showNotification(esPublico ? 'Solicitud visible en agenda pública' : 'Solicitud oculta de agenda pública', 'success');
                    } catch (error) {
                        showNotification(error.message, 'error');
                        // Revertir checkbox en caso de error
                        const checkbox = document.querySelector(`.publico-checkbox[data-id="${id}"]`);
                        if (checkbox) checkbox.checked = !esPublico;
                    }
                }

                // Funciones para gestionar eventos (desde filas con id 'ev_<id>')
                async function modificarEvento(evId) {
                    // evId expected like 'ev_1'
                    if (!evId) return;
                    const raw = String(evId).replace('ev_', '');
                    const id = parseInt(raw, 10);
                    if (isNaN(id)) return showNotification('ID de evento inválido', 'error');

                    const nombre = prompt('Nuevo nombre de banda (dejar vacío para no cambiar):');
                    const fecha_hora = prompt('Nueva fecha y hora (YYYY-MM-DD HH:MM) (dejar vacío para no cambiar):');
                    const descripcion = prompt('Descripción (dejar vacío para no cambiar):');

                    const body = {};
                    if (nombre) body.nombre_banda = nombre;
                    if (fecha_hora) body.fecha_hora = fecha_hora;
                    if (descripcion) body.descripcion = descripcion;

                    if (Object.keys(body).length === 0) return;

                    showNotification('Actualizando evento...', 'info');
                    try {
                        const res = await fetch(`/api/admin/eventos_confirmados/${id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(body)
                        });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.message || 'Error al actualizar evento');
                        showNotification(data.message || 'Evento actualizado', 'success');
                        cargarSolicitudes();
                    } catch (err) {
                        showNotification(err.message, 'error');
                    }
                }

                async function cancelarEventoClient(evId) {
                    if (!confirm('¿Deseas cancelar/desactivar este evento?')) return;
                    const raw = String(evId).replace('ev_', '');
                    const id = parseInt(raw, 10);
                    if (isNaN(id)) return showNotification('ID de evento inválido', 'error');

                    showNotification('Cancelando evento...', 'info');
                    try {
                        const res = await fetch(`/api/admin/eventos_confirmados/${id}/cancel`, { method: 'PATCH' });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.message || 'Error al cancelar evento');
                        showNotification(data.message || 'Evento cancelado', 'success');
                        cargarSolicitudes();
                    } catch (err) {
                        showNotification(err.message, 'error');
                    }
                }

                async function eliminarEventoClient(evId) {
                    if (!confirm(`¿Estás seguro de que deseas eliminar el evento ${evId}? Esta acción borrará datos relacionados.`)) return;
                    const raw = String(evId).replace('ev_', '');
                    const id = parseInt(raw, 10);
                    if (isNaN(id)) return showNotification('ID de evento inválido', 'error');

                    showNotification('Eliminando evento...', 'info');
                    try {
                        const res = await fetch(`/api/admin/eventos_confirmados/${id}`, { method: 'DELETE' });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.message || 'Error al eliminar evento');
                        showNotification(data.message || 'Evento eliminado', 'success');
                        cargarSolicitudes();
                    } catch (err) {
                        showNotification(err.message, 'error');
                    }
                }

                async function eliminarSolicitud(id) {
                    if (!confirm(`¿Estás seguro de que deseas eliminar la solicitud ID ${id}? Esta acción no se puede deshacer.`)) {
                        return;
                    }

                    showNotification('Eliminando solicitud...', 'info');

                    try {
                        const res = await fetch(`/api/admin/solicitudes/${id}`, {
                            method: 'DELETE'
                        });

                        const data = await res.json();

                        if (!res.ok) {
                            throw new Error(data.message || 'Error al eliminar');
                        }

                        showNotification(data.message, 'success');

                        // Recargar la lista completa para asegurar consistencia
                        await cargarSolicitudes();
                    } catch (error) {
                        showNotification(error.message, 'error');
                    }
                }

                function showNotification(message, type = 'warning', duration = 4000) {
                    clearTimeout(notificationTimer);

                    const banner = document.getElementById('notification-banner');
                    banner.textContent = message;
                    banner.className = `show ${type}`;

                    notificationTimer = setTimeout(() => {
                        banner.className = '';
                    }, duration);
                }

                tbody.addEventListener('click', (event) => {
                    const btnUpload = event.target.closest('.btn-upload-flyer');
                    if (!btnUpload) return;
                    event.stopPropagation();
                    event.preventDefault();
                    const solicitudId = btnUpload.dataset.solicitudId;
                    if (!solicitudId) return;
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = 'image/jpeg, image/png';
                    input.addEventListener('change', async () => {
                        const file = input.files[0];
                        if (!file) return;
                        btnUpload.disabled = true;
                        btnUpload.textContent = 'Subiendo...';
                        try {
                            const formData = new FormData();
                            formData.append('flyer', file);
                            const res = await fetch(`${API_BASE_URL}/api/uploads/flyers?solicitudId=${encodeURIComponent(solicitudId)}`, {
                                method: 'POST',
                                headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken') || ''}` },
                                body: formData
                            });
                            const data = await res.json();
                            if (!res.ok) throw new Error(data.message || 'Error al subir imagen');
                            // Actualizar url_flyer en la solicitud via API
                            const resPatch = await fetch(`${API_BASE_URL}/api/admin/solicitudes/${solicitudId}/flyer`, {
                                method: 'PATCH',
                                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('authToken') || ''}` },
                                body: JSON.stringify({ url_flyer: data.url })
                            });
                            if (resPatch.ok) {
                                showNotification('Flyer subido correctamente', 'success');
                                await cargarSolicitudes();
                            } else {
                                // El archivo se subió pero no se pudo guardar la URL en BD;
                                // mostrar la imagen igualmente de manera optimista
                                const cell = btnUpload.closest('td');
                                if (cell) {
                                    cell.innerHTML = `<img src="${data.url}" class="flyer-thumb" alt="flyer" onerror="handleFlyerError(this)">`;
                                }
                                showNotification('Flyer subido. Recarga para confirmar.', 'warning');
                            }
                        } catch (err) {
                            showNotification(err.message, 'error');
                            btnUpload.disabled = false;
                            btnUpload.textContent = '＋ Subir imagen';
                        }
                    });
                    input.click();
                }, true);

                // Proteger esta página: redirigir a login si no está autenticado
                // navbarManager ya fue instanciado automáticamente por navbar.js
                if (!navbarManager.protectAdminPage()) {
                    return; // Salir si no está autenticado
                }
                // navbarManager.injectNavbar() ya fue inyectado automáticamente por navbar.js

                // ============================================================
                // FUNCIONES DE PERMISOS - delegadas a navbarManager
                // ============================================================
                const tienePermiso = (permiso) => navbarManager.tienePermiso(permiso);
                const tieneAlgunPermiso = (permisos) => navbarManager.tieneAlgunPermiso(permisos);
                const tieneRol = (rol) => navbarManager.tieneRol(rol);
                const puedeEditar = (recurso) => {
                    // Permisos de edición para cada recurso
                    const permisosEdicion = {
                        'solicitudes': 'solicitudes.editar',
                        'eventos': 'eventos.editar',
                        'personal': 'personal.gestionar',
                        'usuarios': 'usuarios.editar'
                    };
                    return tienePermiso(permisosEdicion[recurso] || `${recurso}.editar`);
                };

                console.log('%c✅ Sistema de Permisos Iniciado', 'color: #00cc00; font-weight: bold; font-size: 13px');
                console.log('Usuario:', navbarManager.userName || 'Anónimo');
                console.log('Rol:', navbarManager.userRole || 'Sin rol');
                console.log('Roles:', navbarManager.userRoles || []);
                console.log('Permisos:', navbarManager.userPermisos || []);

                // Load solicitudes on page load
                cargarSolicitudes();
            });
        </script>
</body>

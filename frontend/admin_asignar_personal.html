<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administración - Asignar Personal</title>
    <link rel="stylesheet" href="/css/tailwind.min.css">
    <link rel="stylesheet" href="/css/fontawesome.min.css">
    <link rel="stylesheet" href="/styles/admin.css">
    <style>
        .rol-group {
            margin-bottom: 16px;
            padding: 16px;
            background: rgba(240, 171, 252, 0.03);
            border: 1px solid rgba(240, 171, 252, 0.1);
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .rol-group:hover {
            background: rgba(240, 171, 252, 0.06);
            border-color: rgba(240, 171, 252, 0.2);
        }
        .rol-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--color-secondary);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .rol-group select {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border-radius: 6px;
            border: 2px solid rgba(240, 171, 252, 0.2);
            background: #0f0f0f;
            color: var(--color-text);
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .rol-group select:focus {
            outline: none;
            border-color: var(--color-secondary);
            background: #1a1a1a;
            box-shadow: 0 0 0 3px rgba(240, 171, 252, 0.1);
        }
        option:disabled { color: #9ca3af; background-color: #1f2937; font-style: italic; }
        #solicitud-title { font-size: 1rem; color: var(--color-text-muted, #9ca3af); font-weight: 400; margin-bottom: 0; }
    </style>
</head>

<body>
    <script src="/navbar.js"></script>
    <main class="wrap" style="max-width: 860px;">
        <div class="page-header">
            <a href="/admin_solicitudes.html" class="btn-back">
                <i class="fas fa-arrow-left"></i> Volver a Solicitudes
            </a>
            <h1>Asignar Personal</h1>
            <div class="spacer"></div>
        </div>

        <div class="card">
            <div class="card-header">
                <span class="card-title"><i class="fas fa-users-cog"></i> Asignación de Personal</span>
                <span id="solicitud-title"></span>
            </div>
            <div id="assignment-form-container">
                <div style="text-align:center;padding:40px;color:#9ca3af;">
                    <i class="fas fa-spinner fa-spin" style="font-size:24px;margin-bottom:12px;display:block;color:var(--color-secondary)"></i>
                    Cargando datos...
                </div>
            </div>
            <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap;">
                <button class="btn btn-secondary" onclick="window.location.href='/admin_solicitudes.html'">
                    <i class="fas fa-arrow-left"></i> Cancelar
                </button>
                <button id="save-button" class="btn btn-success">
                    <i class="fas fa-save"></i> Guardar Asignaciones
                </button>
            </div>
        </div>
    </main>
    <div id="notification-banner"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Proteger esta página antes de cargar datos
            if (!navbarManager || !navbarManager.protectAdminPage()) return;

            const params = new URLSearchParams(window.location.search);
            const solicitudId = params.get('solicitudId');
            const tipoEventoId = params.get('tipoEventoId');

            const formContainer = document.getElementById('assignment-form-container');
            const saveButton = document.getElementById('save-button');
            const solicitudTitle = document.getElementById('solicitud-title');
            let notificationTimer;

            if (!solicitudId || !tipoEventoId) {
                formContainer.innerHTML = '<p style="color:var(--color-danger);font-weight:bold;"><i class="fas fa-exclamation-triangle"></i> Error: Faltan el ID de solicitud o el ID de tipo de evento en la URL.</p>';
                saveButton.style.display = 'none';
                return;
            }

            solicitudTitle.textContent = `Solicitud #${solicitudId} · Tipo: ${tipoEventoId}`;

            async function cargarDatosDeAsignacion() {
                try {
                    const token = localStorage.getItem('authToken');
                    const headers = {};
                    if (token) headers['Authorization'] = `Bearer ${token}`;

                    const url = `/api/admin/asignacion-data?solicitudId=${solicitudId}&tipoEventoId=${tipoEventoId}`;
                    const response = await fetch(url, { headers });

                    if (response.status === 401) {
                        window.location.href = '/login.html';
                        return;
                    }
                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`Error ${response.status}: ${errorText}`);
                    }

                    const data = await response.json();

                    if (!data.rolesRequeridos || data.rolesRequeridos.length === 0) {
                        formContainer.innerHTML = '<p style="color:#9ca3af;"><i class="fas fa-info-circle"></i> Este tipo de evento no tiene roles de personal requeridos.</p>';
                        saveButton.disabled = true;
                        return;
                    }

                    renderizarFormulario(data.rolesRequeridos, data.personalDisponible, data.asignacionesGuardadas);
                    showNotification('Datos de asignación cargados', 'success', 2500);
                } catch (error) {
                    console.error('[ERROR] cargarDatosDeAsignacion:', error);
                    formContainer.innerHTML = `<p style="color:var(--color-danger);font-weight:bold;"><i class="fas fa-exclamation-triangle"></i> ${error.message}</p>`;
                }
            }

            function renderizarFormulario(rolesRequeridos, personalPorRol, asignacionesGuardadas) {
                let formHtml = '';
                let asignacionesRestantes = [...(asignacionesGuardadas || [])];

                if (asignacionesGuardadas && asignacionesGuardadas.length > 0) {
                    saveButton.innerHTML = '<i class="fas fa-clipboard-list"></i> Ver Orden de Trabajo';
                    saveButton.className = 'btn btn-primary';
                    saveButton.onclick = () => {
                        window.location.href = `/admin_orden_de_trabajo.html?solicitudId=${solicitudId}`;
                    };
                } else {
                    saveButton.innerHTML = '<i class="fas fa-save"></i> Guardar Asignaciones';
                    saveButton.className = 'btn btn-success';
                    saveButton.onclick = null;
                    saveButton.addEventListener('click', guardarAsignaciones);
                }

                rolesRequeridos.forEach(rol => {
                    formHtml += `<div class="rol-group"><label><i class="fas fa-user-tag" style="margin-right:6px;"></i>${rol.rol} <span style="font-weight:400;text-transform:none;font-size:12px;opacity:.7;">(${rol.cantidad} requerido${rol.cantidad !== 1 ? 's' : ''})</span></label>`;
                    for (let i = 0; i < rol.cantidad; i++) {
                        const personalParaEsteRol = personalPorRol[rol.rol] || [];
                        let valorSeleccionado = '';
                        const indiceAsignacion = asignacionesRestantes.findIndex(asig => asig.rol === rol.rol);
                        if (indiceAsignacion > -1) {
                            valorSeleccionado = asignacionesRestantes[indiceAsignacion].personalId;
                            asignacionesRestantes.splice(indiceAsignacion, 1);
                        }
                        let opcionesHtml = '<option value="">-- Seleccionar --</option>';
                        personalParaEsteRol.forEach(persona => {
                            const esSeleccionado = persona.id === valorSeleccionado ? 'selected' : '';
                            opcionesHtml += `<option value="${persona.id}" ${esSeleccionado}>${persona.nombre}</option>`;
                        });
                        formHtml += `<select name="${rol.rol}">${opcionesHtml}</select>`;
                    }
                    formHtml += `</div>`;
                });

                formContainer.innerHTML = formHtml;
                formContainer.addEventListener('change', deshabilitarOpcionesSeleccionadas);
                deshabilitarOpcionesSeleccionadas();
            }

            function deshabilitarOpcionesSeleccionadas() {
                const allSelects = Array.from(formContainer.querySelectorAll('select'));
                const selectedIds = new Set();
                allSelects.forEach(select => { if (select.value) selectedIds.add(select.value); });
                allSelects.forEach(select => {
                    const currentSelection = select.value;
                    select.querySelectorAll('option').forEach(option => {
                        if (option.value) {
                            option.disabled = selectedIds.has(option.value) && option.value !== currentSelection;
                        }
                    });
                });
            }

            async function guardarAsignaciones() {
                saveButton.disabled = true;
                saveButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';

                const selectsElements = Array.from(formContainer.querySelectorAll('select'));
                const selectsSinValor = selectsElements.filter(select => !select.value);
                if (selectsSinValor.length > 0) {
                    showNotification('Por favor seleccioná personal para todos los roles requeridos.', 'error');
                    saveButton.disabled = false;
                    saveButton.innerHTML = '<i class="fas fa-save"></i> Guardar Asignaciones';
                    return;
                }

                const assignments = [];
                selectsElements.forEach(select => {
                    const personalId = select.value;
                    if (personalId && personalId.trim() !== '') {
                        assignments.push({ rol: select.name, personalId });
                    }
                });

                try {
                    const token = localStorage.getItem('authToken');
                    const headers = { 'Content-Type': 'application/json' };
                    if (token) headers['Authorization'] = `Bearer ${token}`;

                    const response = await fetch(`/api/admin/solicitudes/${solicitudId}/asignaciones`, {
                        method: 'POST',
                        headers,
                        body: JSON.stringify(assignments)
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.message || 'Error del servidor.');
                    showNotification(data.message, 'success');
                    setTimeout(() => {
                        window.location.href = `/admin_orden_de_trabajo.html?solicitudId=${solicitudId}`;
                    }, 1000);
                } catch (error) {
                    console.error('Error:', error);
                    showNotification(error.message, 'error');
                    saveButton.disabled = false;
                    saveButton.innerHTML = '<i class="fas fa-save"></i> Guardar Asignaciones';
                }
            }

            function showNotification(message, type = 'info', duration = 4000) {
                clearTimeout(notificationTimer);
                const banner = document.getElementById('notification-banner');
                banner.textContent = message;
                banner.className = `show ${type}`;
                notificationTimer = setTimeout(() => { banner.className = ''; }, duration);
            }

            cargarDatosDeAsignacion();
        });
    </script>
</body>

</html>

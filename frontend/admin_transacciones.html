<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin — Balance</title>
    <link rel="stylesheet" href="/css/tailwind.min.css">
    <link rel="stylesheet" href="/css/fontawesome.min.css">
    <link rel="stylesheet" href="/styles/admin.css">
    <link rel="stylesheet" href="admin_transacciones.css?v=16">
</head>

<body>
    <script src="/navbar.js"></script>
    <main class="wrap">
        <div class="page-header">
            <a href="admin.html" class="btn-back">
                <i class="fas fa-arrow-left"></i> Volver al Panel
            </a>
            <div class="header-title-row">
                <h1>Admin — Balance</h1>
                <div id="service-status" class="service-status ss-connecting" title="Estado del servicio Mercado Pago">
                    <span class="ss-dot"></span>
                    <span id="ss-text">conectando…</span>
                </div>
            </div>
            <div class="spacer"></div>
        </div>

        <!-- Banner de notificación (verde para nuevos ingresos) -->
        <div id="banner" class="banner hidden" role="status" aria-live="polite"></div>

        <!-- controles principales -->
        <div class="controls small justify-between my-4">
            <div class="flex gap-2">
                <button id="check-btn" class="btn btn-green">Actualizar</button>
                <button id="btn-abrir-caja" class="btn btn-orange">
                    <i class="fas fa-lock-open mr-1"></i> Abrir Caja
                </button>
                <button id="btn-cerrar-caja" class="btn btn-red hidden">
                    <i class="fas fa-lock mr-1"></i> Cerrar Caja
                </button>
            </div>
            <div class="flex gap-2">
                <button id="filter-btn" class="btn">Ver todos (Ingresos y Egresos)</button>
                <button id="toggle-balance-btn" class="btn">Mostrar saldo</button>
            </div>
        </div>

        <section class="balance-section hidden">
            <h2>Saldo disponible</h2>
            <div id="balance-amount" class="balance-amount">—</div>
            <div class="controls">
                <button id="refresh-btn" class="btn">Actualizar</button>
                <span id="status" class="status">conectando...</span>
            </div>
        </section>

        <section class="tx-section">
            <h2>Últimos movimientos</h2>


            <table class="tx-table" aria-live="polite">
                <thead>
                    <tr>
                        <th class="tx-col-name">Nombre</th>
                        <th class="tx-col-desc">Descripción</th>
                        <th class="tx-col-amount">Monto</th>
                        <th class="tx-col-date">Fecha</th>
                        <th class="tx-col-time">Hora</th>
                    </tr>
                </thead>
                <tbody id="tx-list"></tbody>
            </table>
        </section>

        <!-- MODAL: ABRIR CAJA -->
        <div id="modal-abrir-caja" class="modal hidden">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Abrir Nueva Caja</h2>
                    <button class="modal-close" aria-label="Cerrar">&times;</button>
                </div>

                <form id="form-abrir-caja-transacciones" class="modal-body">
                    <div class="form-group">
                        <label for="tx-nombre-caja">Nombre de Caja (ej: "Caja 1", "Mostrador A")</label>
                        <input type="text" id="tx-nombre-caja" placeholder="Nombre descriptivo de la caja" required>
                    </div>

                    <div class="form-group">
                        <label for="tx-id-evento-confirmado">Evento Asociado (opcional)</label>
                        <select id="tx-id-evento-confirmado">
                            <option value="">-- Sin evento asociado --</option>
                        </select>
                        <small class="text-stone-500">Selecciona el evento si esta caja es para un evento específico</small>
                    </div>

                    <div class="form-group">
                        <label for="tx-saldo-inicial">
                            Saldo Inicial en Cuenta (MP/Banco)
                            <button type="button" id="btn-cargar-saldo-mp-tx" class="btn btn-purple btn-xs"
                                style="margin-left: 8px;">
                                <i class="fas fa-download"></i> Cargar de MP
                            </button>
                        </label>
                        <input type="number" id="tx-saldo-inicial" min="0" step="0.01" value="0" placeholder="0.00"
                            required>
                        <small id="tx-saldo-info" class="text-stone-500">Referencia del saldo en cuenta/MP</small>
                    </div>

                    <div class="form-group">
                        <label for="tx-efectivo-inicial">Efectivo Inicial en Caja (cambio/vuelto)</label>
                        <input type="number" id="tx-efectivo-inicial" min="0" step="0.01" value="0" placeholder="0.00">
                        <small class="text-stone-500">Dinero físico para dar cambio</small>
                    </div>

                    <div class="form-group">
                        <label for="tx-notas-apertura">Notas (opcional)</label>
                        <textarea id="tx-notas-apertura"
                            placeholder="Ej: Efectivo de ayer, Bill de $5000, etc."></textarea>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn" id="modal-cerrar-btn">Cancelar</button>
                        <button type="submit" class="btn btn-green">
                            <i class="fas fa-lock-open mr-1"></i> Abrir Caja
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="admin_transacciones.js?v=16"></script>
</body>

</html>

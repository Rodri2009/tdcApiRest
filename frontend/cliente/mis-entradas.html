<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Entradas - TDC</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #581c87;
            --secondary: #f0abfc;
            --accent: #7c2d12;
            --dark: #0c0a09;
            --light: #f5f5f4;
        }

        body {
            background: linear-gradient(135deg, var(--dark) 0%, #1a1715 100%);
            color: #e6e6e6;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        .header-gradient {
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
        }

        .badge-pagado {
            background: #10b981;
            color: white;
        }

        .badge-utilizado {
            background: #3b82f6;
            color: white;
        }

        .badge-cancelado {
            background: #ef4444;
            color: white;
        }

        .badge-pendiente {
            background: #f59e0b;
            color: white;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: rgba(240, 171, 252, 0.3);
            transform: translateY(-2px);
        }

        .table-header {
            background: rgba(88, 28, 135, 0.2);
            border-bottom: 2px solid var(--secondary);
        }

        .table-row:hover {
            background: rgba(240, 171, 252, 0.05);
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            box-shadow: 0 0 20px rgba(240, 171, 252, 0.3);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--secondary);
            padding: 8px 16px;
            border: 1px solid var(--secondary);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: var(--secondary);
            color: var(--dark);
        }

        .spinner {
            border: 3px solid rgba(240, 171, 252, 0.2);
            border-top: 3px solid var(--secondary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 20px;
            color: var(--secondary);
            opacity: 0.5;
        }

        .loader-container {
            display: none;
            justify-content: center;
            padding: 40px;
        }

        .loader-container.active {
            display: flex;
        }

        .error-banner {
            background: #fee2e2;
            color: #7f1d1d;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #dc2626;
            display: none;
        }

        .error-banner.active {
            display: block;
        }

        .success-banner {
            background: #dcfce7;
            color: #166534;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #16a34a;
            display: none;
        }

        .success-banner.active {
            display: block;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .table-responsive {
                font-size: 12px;
            }

            .btn-primary,
            .btn-secondary {
                padding: 8px 12px;
                font-size: 12px;
            }

            .user-info {
                flex-direction: column;
                align-items: flex-start !important;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div class="header-gradient p-6 shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-arrow-left cursor-pointer text-white hover:text-gray-200 text-xl"
                    onclick="window.history.back()"></i>
                <h1 class="text-white text-2xl font-bold">🎫 Mis Entradas</h1>
            </div>
            <div class="user-info flex items-center gap-6">
                <div class="text-right">
                    <p class="text-white font-semibold" id="userName">Cargando...</p>
                    <p class="text-gray-200 text-sm" id="userEmail">-</p>
                </div>
                <button class="btn-primary" onclick="logout()">
                    <i class="fas fa-sign-out-alt mr-2"></i> Salir
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-6xl mx-auto p-6">
        <!-- Error Banner -->
        <div class="error-banner" id="errorBanner">
            <i class="fas fa-exclamation-circle mr-2"></i>
            <span id="errorMessage"></span>
        </div>

        <!-- Success Banner -->
        <div class="success-banner" id="successBanner">
            <i class="fas fa-check-circle mr-2"></i>
            <span id="successMessage"></span>
        </div>

        <!-- Loader -->
        <div class="loader-container" id="loader">
            <div class="spinner"></div>
        </div>

        <!-- Entradas List -->
        <div id="entradasContainer">
            <!-- Se carga dinámicamente -->
        </div>
    </div>

    <script src="../navbar.js"></script>
    <script src="./mis-entradas.js"></script>
</body>

</html>

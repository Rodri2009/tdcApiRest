services:
  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ../frontend:/usr/share/nginx/html
      - ../docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ../docker/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - tdc_network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      PORT: ${PORT}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      EMAIL_SERVICE: ${EMAIL_SERVICE}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_ADMIN: ${EMAIL_ADMIN}
      JWT_SECRET: ${JWT_SECRET}
      DEBUG_FLAGS: ${DEBUG_FLAGS:-}
      DEBUG_VERBOSE: ${DEBUG_VERBOSE:-false}
      MP_SERVER_URL: ${MP_SERVER_URL}
      WA_SERVER_URL: ${WA_SERVER_URL}
      USER_DATA_DIR: ${USER_DATA_DIR}
      WA_USER_DATA_DIR: ${WA_USER_DATA_DIR}
      HEADLESS: ${HEADLESS}
      ENABLE_VNC: ${ENABLE_VNC:-false}
      ENABLE_PUPPETEER_MP: ${ENABLE_PUPPETEER_MP:-false}
      ENABLE_PUPPETEER_WA: ${ENABLE_PUPPETEER_WA:-false}
    expose:
      - "3000"
      - "5901"
    networks:
      - tdc_network
    volumes:
      - ../backend:/app
      - tdc_backend_node_modules:/app/node_modules
      - ../scripts:/app/scripts
      - ../backend/profile/mp-profile:/home/pptruser/mp-profile
      - ../backend/profile/wa-profile:/home/pptruser/wa-profile
      - ../scripts/infraestructura/docker_entrypoint.sh:/usr/local/bin/docker-entrypoint.sh

  mariadb:
    image: mariadb:10.6
    command:
      - '--max_allowed_packet=64M'
      - '--log-bin=/var/lib/mysql/binlogs/mariadb-bin'
      - '--binlog-format=MIXED'
      - '--binlog-expire-logs-seconds=604800'
      - '--max-binlog-size=1073741824'
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MARIADB_ROOT_PASSWORD" ]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "3306"
    networks:
      - tdc_network
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - mariadb_binlogs:/var/lib/mysql/binlogs
      - ../database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - ../database/03_test_data.sql:/docker-entrypoint-initdb.d/03_test_data.sql
      - ../database/seeds:/var/lib/mysql-files

# Definición de redes aisladas para DEV
networks:
  tdc_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24

# Definición de volúmenes persistentes
volumes:
  mariadb_data:
  mariadb_binlogs:
  tdc_backend_node_modules:
